name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_DEPLOYMENT_ENV: staging
      VITE_COMMUNITY_SYNC_MODE: demo
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize feature formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/operational-responder-dispatch'
        run: |
          npx prettier --write supabase/functions/dispatch-incident-notification/index.ts supabase/functions/incident-lifecycle/e2e_test.ts
          if git diff --quiet; then
            exit 0
          fi
          git diff -- supabase/functions/dispatch-incident-notification/index.ts supabase/functions/incident-lifecycle/e2e_test.ts
          exit 1
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:strict
      - run: npm run test:coverage
      - run: npm run build
