name: Format feature branch

on:
  push:
    branches:
      - feat/operational-responder-dispatch

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write supabase/functions/dispatch-incident-notification/index.ts supabase/functions/incident-lifecycle/e2e_test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add supabase/functions/dispatch-incident-notification/index.ts supabase/functions/incident-lifecycle/e2e_test.ts
          git commit -m "style: format responder dispatch files"
          git push
