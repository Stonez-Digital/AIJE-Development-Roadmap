name: Incident Lifecycle E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/**"
      - ".github/workflows/incident-lifecycle-e2e.yml"

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Start ephemeral Supabase
        run: >-
          supabase start
          --exclude studio,imgproxy,mailpit,logflare,vector,supavisor,realtime,storage-api,edge-runtime,postgres-meta
      - name: Verify authenticated lifecycle and tenant isolation
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          deno test --node-modules-dir=auto --minimum-dependency-age 0 --allow-net --allow-env \
            supabase/functions/incident-lifecycle/e2e_test.ts
      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup
