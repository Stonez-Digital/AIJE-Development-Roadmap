name: Cloudflare Pages Verification

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "supabase/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Cloudflare production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_DEPLOYMENT_ENV: production
      VITE_COMMUNITY_SYNC_MODE: live
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run typecheck:strict
          npm run test:coverage
          npm run build

      - name: Cloudflare deployment handoff
        run: |
          echo "Build verified successfully."
          echo "Cloudflare Pages is connected directly to Stonez-Digital/AIJE-Development-Roadmap."
          echo "Production branch: main"
          echo "Cloudflare will deploy this commit through its native Git integration."
